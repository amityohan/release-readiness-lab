apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: checkout-system
  labels:
    app: checkout-api
    tier: backend
    version: v2.4
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        version: v2.4
    spec:
      containers:
      - name: checkout-api
        image: kalvium/checkout-api:v2.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: checkout-api-config
        - secretRef:
          name: checkout-api-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
